# WENET ota-ona Telegram WebApp — parent.wenet.uz (va www.parent.wenet.uz)
# React Router SPA, static build fayllar shu serverdan xizmat qilinadi.

server {
    listen 80;
    listen [::]:80;
    server_name parent.wenet.uz www.parent.wenet.uz;

    # Certbot HTTP-01 tekshiruvi uchun, keyin 443'ga redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://parent.wenet.uz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.parent.wenet.uz;

    ssl_certificate     /etc/letsencrypt/live/parent.wenet.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parent.wenet.uz/privkey.pem;

    # www -> apex
    return 301 https://parent.wenet.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name parent.wenet.uz;

    ssl_certificate     /etc/letsencrypt/live/parent.wenet.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parent.wenet.uz/privkey.pem;

    root /var/www/wenet/parent/dist;
    index index.html;

    # Telegram WebApp iframe/webview ichida ochiladi — X-Frame-Options QO'YILMAYDI.
    # Manzil admin → Sozlamalar → Telegram → "Ota-ona WebApp manzili" ga yoziladi.

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hash'langan build assetlari — uzoq muddat keshlanadi
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html hech qachon keshlanmasin — yangi deploy darhol ko'rinsin
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — barcha route React Router'ga
    location / {
        try_files $uri $uri/ /index.html;
    }
}
