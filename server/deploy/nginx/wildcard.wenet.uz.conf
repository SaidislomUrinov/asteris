# WENET brend subdomenlari — {slug}.wenet.uz (docs/API_CONTRACT_multi_center.md §8)
# Barcha mijozlar BITTA client build'ga qaraydi; mijoz hostname'dan aniqlanadi.
# Aniq server_name'li bloklar (app, api, console, parent, www) har doim
# regex'dan ustun — ular o'z konfiglarida qoladi.
#
# Sertifikat: *.wenet.uz wildcard (acme.sh + acme-dns, docs/DEPLOY_subdomain_acme_dns.md)
# Yangi mijoz uchun hech narsa qilinmaydi — admin panelda slug yoziladi, tamom.

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<slug>[a-z0-9-]+)\.wenet\.uz$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<slug>[a-z0-9-]+)\.wenet\.uz$;

    ssl_certificate     /etc/nginx/ssl/wildcard.wenet.uz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard.wenet.uz/privkey.pem;

    root /var/www/wenet/app;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
