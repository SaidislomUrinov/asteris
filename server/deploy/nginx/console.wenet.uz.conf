# WENET admin — console.wenet.uz (va www.console.wenet.uz)
# React Router SPA, static build fayllar shu serverdan xizmat qilinadi.

server {
    listen 80;
    listen [::]:80;
    server_name console.wenet.uz www.console.wenet.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://console.wenet.uz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.console.wenet.uz;

    ssl_certificate     /etc/letsencrypt/live/console.wenet.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.wenet.uz/privkey.pem;

    return 301 https://console.wenet.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.wenet.uz;

    ssl_certificate     /etc/letsencrypt/live/console.wenet.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.wenet.uz/privkey.pem;

    root /var/www/wenet/admin/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
