# WENET website — wenet.uz (va www.wenet.uz)
# Vite build (static + prerender bo'lsa uning fayllari), shu serverdan xizmat qilinadi.

server {
    listen 80;
    listen [::]:80;
    server_name wenet.uz www.wenet.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://wenet.uz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wenet.uz;

    ssl_certificate     /etc/letsencrypt/live/wenet.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wenet.uz/privkey.pem;

    return 301 https://wenet.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wenet.uz;

    ssl_certificate     /etc/letsencrypt/live/wenet.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wenet.uz/privkey.pem;

    # Serverda sayt build'i (website/dist ichidagi fayllar) shu papkada turadi.
    root /var/www/wenet/web;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Xavfsizlik sarlavhalari (HSTS — Google HTTPS signalini mustahkamlaydi).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Eski inglizcha yo'llar → o'zbekcha slug (301 — Google eski URL
    # reytingini yangisiga o'tkazadi). Ro'yxat: website/src/seo/routes.js.
    rewrite ^(/ru|/en)?/pricing/?$  $1/narxlar                  permanent;
    rewrite ^(/ru|/en)?/compare/?$  $1/excel-bilan-solishtirish permanent;
    rewrite ^(/ru|/en)?/faq/?$      $1/savol-javob              permanent;
    rewrite ^(/ru|/en)?/parents/?$  $1/ota-onalar               permanent;
    rewrite ^(/ru|/en)?/privacy/?$  $1/maxfiylik-siyosati       permanent;
    rewrite ^(/ru|/en)?/offer/?$    $1/ommaviy-oferta           permanent;

    # Hash'langan build assetlari — uzoq muddat keshlanadi
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sitemap.xml { expires 1h; }
    location = /robots.txt  { expires 1h; }

    # Tekshiruv sahifalari dinamik (QR kodlardagi /payment/verify/:id) —
    # prerender yo'q, SPA ochadi.
    location ~ ^/(?:(?:ru|en)/)?(?:certificate|payment)/verify/[^/]+/?$ {
        expires -1;
        try_files /index.html =404;
    }

    # Indekslanadigan sahifalar: prerender bo'lsa `/narxlar/index.html`,
    # bo'lmasa SPA. HTML hech qachon keshlanmaydi — yangi deploy darhol ko'rinsin.
    location ~ ^/(?:(?:ru|en)/?)?(?:(?:narxlar|excel-bilan-solishtirish|savol-javob|ota-onalar|maxfiylik-siyosati|ommaviy-oferta)/?)?$ {
        expires -1;
        try_files $uri/index.html $uri /index.html;
    }

    # Qolgan hamma narsa — haqiqiy 404 status (soft-404 emas). 404.html
    # prerender'da yaratiladi; yo'q bo'lsa SPA o'zi 404 sahifani chizadi.
    location / {
        try_files $uri =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
        try_files /404.html /index.html;
    }
}
