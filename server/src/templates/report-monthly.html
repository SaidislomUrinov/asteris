<div style="font-family:Arial,Helvetica,sans-serif;background:#f4f5f7;padding:32px">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px">
    <h1 style="margin:0 0 4px;font-size:20px;color:#111827">Oylik hisobot — {{month}}</h1>
    <p style="margin:0 0 16px;font-size:14px;color:#6b7280">{{clientName}}</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;color:#374151">
      <tr><td style="padding:8px 0;border-bottom:1px solid #f3f4f6">Tushum</td><td style="text-align:right;font-weight:bold">{{revenue}}</td></tr>
      <tr><td style="padding:8px 0;border-bottom:1px solid #f3f4f6">Xarajat</td><td style="text-align:right;font-weight:bold">{{expense}}</td></tr>
      <tr><td style="padding:8px 0;border-bottom:1px solid #f3f4f6">Sof foyda</td><td style="text-align:right;font-weight:bold">{{profit}}</td></tr>
      <tr><td style="padding:8px 0;border-bottom:1px solid #f3f4f6">Qarzdorlik</td><td style="text-align:right;font-weight:bold">{{debt}}</td></tr>
      <tr><td style="padding:8px 0;border-bottom:1px solid #f3f4f6">Faol o'quvchilar</td><td style="text-align:right;font-weight:bold">{{activeStudents}}</td></tr>
      <tr><td style="padding:8px 0">Davomat</td><td style="text-align:right;font-weight:bold">{{attendanceRate}}</td></tr>
    </table>
    <a href="{{link}}" style="display:inline-block;margin-top:18px;background:#2563eb;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:14px">Batafsil hisobot</a>
    <p style="margin:20px 0 0;font-size:12px;color:#9ca3af">WENET — o'quv markazlarini boshqarish platformasi</p>
  </div>
</div>
